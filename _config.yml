# Post bahasa diatur per folder, jadi tidak perlu tulis lang/permalink di tiap post.
defaults:
  - scope:
      path: "_posts/id"
      type: posts
    values:
      layout: post
      lang: id
      permalink: /id/:title/
  - scope:
      path: "_posts/en"
      type: posts
    values:
      layout: post
      lang: en
      permalink: /en/:title/
  - scope:
      path: ""
      type: pages
    values:
      layout: default

exclude:
  - README.md
  - vendor
  - .jekyll-cache
